name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to enable Pages and publish to it.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Stop a broken questions.js or mismatched ?v= values from being published.
      - name: Validate questions and pages
        run: |
          node demo/scripts/validate.js
          node tests/bank.test.js
          node tests/site.test.js

      # enablement: true turns Pages on (build type "workflow") if it isn't already.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the site, without the earlier generic quiz (demo/), the tests, the Apps Script source or git files.
      - name: Collect the site files
        run: |
          mkdir _site
          tar cf - --exclude=./_site --exclude=./.git --exclude=./.github --exclude=./demo --exclude=./tests --exclude=./apps-script --exclude=./private . | tar xf - -C _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub's Pages service sometimes refuses a deploy ("try again later"); try once more before giving up.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy (second attempt)
        if: steps.deployment.outcome == 'failure'
        id: deployment2
        uses: actions/deploy-pages@v4
