name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate questions and pages
        run: node scripts/validate.js
      - name: Portal question bank
        run: node portal/tests/bank.test.js
      - name: Portal Code.gs
        run: node portal/tests/code-gs.test.js
